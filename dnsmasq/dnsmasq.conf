# flow_dns — split-horizon DNS for ktranslate --dns (flow src_host / dst_host).
# Local PTR: dnsmasq.d/hosts.generated.conf (from scripts/refresh-flow-dns.sh)
# Upstream:  dnsmasq.d/upstream.conf (host / corp DNS for everything else)
user=root
bind-interfaces
interface=eth0
port=53
conf-dir=/etc/dnsmasq.d/,*.conf
