# Route devices from one estate discovery run into per-vendor poller files.
#
# Copy to config/vendor-split.yaml (gitignored with the rest of config/) or
# leave this file in place — split-devices-by-vendor.py falls back to it.
#
# First matching rule wins. Unmatched devices go to default_group.

source_group: estate
default_group: other

rules:
  - group: cisco
    mib_profile:
      - "cisco*"
      - "catalyst*"
      - "nexus*"
      - "meraki*"
      - "iosxe*"
      - "iosxr*"
    oid_prefix:
      - ".1.3.6.1.4.1.9"       # Cisco
      - ".1.3.6.1.4.1.29671"   # Meraki
  - group: palo
    mib_profile:
      - "palo*"
      - "panos*"
    oid_prefix:
      - ".1.3.6.1.4.1.25461"
  - group: juniper
    mib_profile:
      - "juniper*"
      - "junos*"
      - "pulse_secure*"
    oid_prefix:
      - ".1.3.6.1.4.1.2636"
      - ".1.3.6.1.4.1.12532"
